<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>学习教练 · edu-agent</title>
<style>
:root{
  --bg0:#f7f5f0; --bg1:#eef1f4; --ink:#22333f; --ink-soft:#5a6e7a;
  --brand:#1e5d83; --brand-deep:#174a68; --accent:#e8a13d;
  --card:#ffffff; --line:#e3e0d8; --coach:#ffffff; --user:#1e5d83;
  --ok:#3d9960; --warn:#c26a3d;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);background:linear-gradient(160deg,var(--bg0),var(--bg1)) fixed}
main{max-width:760px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}

/* header */
header{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#3b86ad);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none;
  box-shadow:0 4px 14px rgba(30,93,131,.28)}
h1{font-size:18px;margin:0;line-height:1.2}
.sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;background:#c8c4ba;transition:background .3s}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(61,153,96,.15)}
button{font:inherit;cursor:pointer}

/* transcript */
#chat{flex:1;overflow-y:auto;padding:8px 18px 18px;scroll-behavior:smooth}
.row{display:flex;gap:10px;margin:14px 0;animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row.user{flex-direction:row-reverse}
.bubble{max-width:78%;padding:12px 15px;border-radius:18px;line-height:1.75;font-size:15px;
  white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 10px rgba(34,51,63,.06)}
.row.coach .bubble{background:var(--coach);border:1px solid var(--line);border-top-left-radius:6px}
.row.user .bubble{background:var(--user);color:#fff;border-top-right-radius:6px}
.bubble a{color:var(--brand);text-decoration:none;border-bottom:1px dashed currentColor}
.row.user .bubble a{color:#cfe8f5}
.para{margin:0 0 8px}.para:last-child{margin-bottom:0}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:4px 10px;border-radius:999px;background:#eef4f8;
  border:1px solid #d5e3ec;font-size:13px;color:var(--brand);text-decoration:none}
.chip:hover{background:#dcebf3}
.artifact{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:9px 16px;border-radius:12px;
  background:linear-gradient(135deg,#fdf3e3,#fbe8c8);border:1px solid #ecd3a4;color:#8a5a13;
  font-size:14px;font-weight:600;text-decoration:none}
.artifact:hover{background:#fbe8c8}

/* next step card */
.stepcard{max-width:78%;margin:-4px 0 14px 52px;padding:12px 15px;border-radius:14px;
  background:#fffaf0;border:1px solid #ecdcb8;animation:rise .28s ease}
.stepcard .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  color:#96700f;letter-spacing:.05em;margin-bottom:6px}
.stepcard .body{font-size:15px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.stepcard .body.done{opacity:.55;text-decoration:line-through}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 13px;
  border-radius:12px;border:1.5px solid #ddd3bd;background:#fff;font-size:14.5px;line-height:1.55;color:var(--ink)}
.opt:hover{border-color:var(--accent);background:#fffcf4}
.opt:disabled{cursor:default}
.opt.picked{border-color:var(--brand);background:#eef4f8;font-weight:600}
.opt .letter{flex:none;width:24px;height:24px;border-radius:8px;background:#f2ecdd;color:#8a7a45;
  display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.picked .letter{background:var(--brand);color:#fff}

/* protocol inspector */
.proto-btn{margin:6px 0 0 52px;background:none;border:none;color:#a9a294;font-size:12px;padding:2px 4px;
  border-radius:6px}
.proto-btn:hover{color:var(--brand);background:#f0ede6}
pre.proto{display:none;margin:6px 0 14px 52px;padding:12px 14px;border-radius:12px;background:#262d33;
  color:#d8e2e8;font-size:12px;line-height:1.6;overflow-x:auto;max-width:78%;white-space:pre-wrap;
  overflow-wrap:anywhere}
pre.proto.open{display:block}

/* typing */
.typing{display:inline-flex;gap:5px;padding:14px 16px;background:var(--coach);border:1px solid var(--line);
  border-radius:18px;border-top-left-radius:6px}
.typing i{width:7px;height:7px;border-radius:50%;background:#b9c2c8;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* composer */
#bar{padding:10px 14px 16px}
#quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
#quick button{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--ink-soft)}
#quick button:hover{border-color:var(--brand);color:var(--brand)}
.box{display:flex;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 4px 18px rgba(34,51,63,.07)}
#input{flex:1;border:none;outline:none;resize:none;font:inherit;font-size:15px;line-height:1.55;
  max-height:120px;background:transparent;color:var(--ink)}
#send{flex:none;width:40px;height:40px;border-radius:13px;border:none;background:var(--brand);
  color:#fff;display:grid;place-items:center}
#send:hover{background:var(--brand-deep)}
#send:disabled{opacity:.45;cursor:default}
.hint{font-size:11.5px;color:#a9a294;margin-top:7px;text-align:center}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#3a2c22;color:#ffe9d6;padding:11px 18px;border-radius:12px;font-size:13.5px;
  transition:all .3s;pointer-events:none;max-width:82%;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:560px){
  .bubble,.stepcard,pre.proto{max-width:88%}
  .stepcard,.proto-btn,pre.proto{margin-left:0}
}
</style>
</head>
<body>
<main>
  <header>
    <div class="avatar">学</div>
    <div>
      <h1>学习教练</h1>
      <div class="sub">edu-agent 本地演示 · 协议驱动渲染</div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></div>
  </header>

  <div id="chat"></div>

  <div id="bar">
    <div id="quick">
      <button data-cmd="/memory on">开启记忆</button>
      <button data-cmd="/memory off">暂停记忆</button>
      <button data-cmd="/forget">删除记录</button>
      <button id="newSession">新会话</button>
    </div>
    <div class="box">
      <textarea id="input" rows="1" placeholder="问点什么，比如：给我讲讲光合作用…"></textarea>
      <button id="send" aria-label="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="hint">Enter 发送 · Shift+Enter 换行 · 选项题可直接点选</div>
  </div>
</main>
<div id="toast"></div>

<script>
"use strict";
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
let history = [];          // [{role:"user"|"assistant", text}]
let busy = false;

/* ---------- helpers ---------- */
function el(tag, cls, text){ const n=document.createElement(tag); if(cls)n.className=cls;
  if(text!==undefined)n.textContent=text; return n; }
function scroll(){ chat.scrollTop = chat.scrollHeight; }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), 4200); }

/* 解析 message 文本：[title](url) 链接、段落、互动图按钮 */
function renderMessage(body, text){
  const linkRe = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
  const artifactRe = /\[打开互动图\]\((https?:\/\/[^\s)]+)\)/;
  let artifact = null;
  text = text.replace(artifactRe, (m,url)=>{ artifact=url; return ""; });
  for (const para of text.split(/\n{2,}/)){
    const p = el("p","para");
    let last = 0, m;
    while ((m = linkRe.exec(para)) !== null){
      if (m.index > last) p.append(para.slice(last, m.index));
      const a = el("a","chip"); a.href = m[2]; a.target="_blank"; a.rel="noopener noreferrer";
      a.textContent = m[1]; p.append(a);
      last = m.index + m[0].length;
    }
    if (last < para.length) p.append(para.slice(last));
    body.append(p);
  }
  if (artifact){
    const a = el("a","artifact"); a.href=artifact; a.target="_blank"; a.rel="noopener noreferrer";
    a.textContent = "🧩 打开互动图"; body.append(a);
  }
}

/* 协议检查器 */
function addInspector(row, raw){
  const btn = el("button","proto-btn",null); btn.textContent="协议";
  const pre = el("pre","proto");
  pre.textContent = raw;
  btn.onclick = ()=>{ pre.classList.toggle("open"); };
  row.append(btn, pre);
}

/* ---------- 渲染 ---------- */
function addUser(text){
  const row = el("div","row user");
  row.append(el("div","bubble",text));
  chat.append(row); scroll();
}
function addCoach(text, raw){
  const row = el("div","row coach");
  const bubble = el("div","bubble");
  renderMessage(bubble, text);
  row.append(bubble);
  chat.append(row);
  if (raw !== undefined) addInspector(row, raw);
  scroll();
}
function addStepCard(step){
  const card = el("div","stepcard");
  const quiz = step.kind === "question" && /^[A-D][.、．]/.test(step.text.split("\n").pop()||"");
  const tag = el("div","tag", step.kind==="question" ? "❓ 等你回答" : "📌 小任务");
  card.append(tag);
  if (quiz){
    const lines = step.text.split("\n");
    const q = el("div","body", lines[0]);
    card.append(q);
    const opts = el("div","opts");
    const letterRe = /^([A-D])[.、．]\s*(.+)$/;
    lines.slice(1).forEach(line=>{
      const m = letterRe.exec(line.trim());
      if (!m) return;
      const b = el("button","opt");
      b.append(el("span","letter",m[1]));
      b.append(el("span",null,m[2]));
      b.onclick = ()=>{
        if (busy) return;
        [...opts.children].forEach(x=>x.disabled=true);
        b.classList.add("picked");
        q.classList.add("done");
        submit(m[1]);
      };
      opts.append(b);
    });
    card.append(opts);
  } else {
    card.append(el("div","body", step.text));
  }
  chat.append(card); scroll();
}
function addTyping(){
  const row = el("div","row coach"); row.id="typing";
  const t = el("div","typing"); t.append(el("i"),el("i"),el("i"));
  row.append(t); chat.append(row); scroll();
}
function removeTyping(){ const t=document.getElementById("typing"); if(t) t.remove(); }

/* ---------- 通信 ---------- */
async function submit(text){
  text = (text||"").trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = ""; autoGrow();
  addUser(text);
  history.push({role:"user", text});
  addTyping();
  try {
    const res = await fetch("/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({history})});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ("HTTP "+res.status));
    // 接口返回的是面向学习者的纯文本（host 已把 message + next_step 拼好）。
    // 兼容两种情况：纯文本直接渲染；万一拿到 wire JSON 则取 message 字段。
    let parsed = null;
    try { parsed = JSON.parse(data.text); } catch {}
    if (!parsed || typeof parsed !== "object" || !parsed.message) parsed = {message: data.text, next_step: null};
    history.push({role:"assistant", text:parsed.message});
    addCoach(parsed.message, data.text);
    if (parsed.next_step) addStepCard(parsed.next_step);
  } catch (err){
    history.pop();
    toast("这次没有成功："+err.message);
  } finally {
    removeTyping(); busy=false; sendBtn.disabled=false; input.focus(); ping();
  }
}

async function ping(){
  try {
    const r = await fetch("/health");
    const ok = r.ok && (await r.json()).ok;
    document.getElementById("dot").className = "dot" + (ok?" on":"");
    document.getElementById("statusText").textContent = ok ? "本地服务在线" : "服务未就绪";
  } catch { document.getElementById("dot").className="dot";
    document.getElementById("statusText").textContent="代理未运行"; }
}

/* ---------- 事件 ---------- */
sendBtn.onclick = ()=>submit(input.value);
input.addEventListener("keydown", e=>{
  if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submit(input.value); }
});
function autoGrow(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,120)+"px"; }
input.addEventListener("input", autoGrow);
document.querySelectorAll("#quick [data-cmd]").forEach(b=> b.onclick=()=>submit(b.dataset.cmd));
document.getElementById("newSession").onclick = ()=>{
  if (busy) return;
  history = [];
  chat.innerHTML = "";
  addCoach("新会话已开始。想学什么？");
};
ping(); setInterval(ping, 15000);
input.focus();
</script>
</body>
</html>
