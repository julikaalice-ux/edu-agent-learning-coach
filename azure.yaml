# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: agent-framework-agent-with-local-tools-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
      - name: text-embedding-3-small
        model:
          format: OpenAI
          name: text-embedding-3-small
          version: '1'
        sku:
          name: GlobalStandard
          capacity: 5
  agent-framework-agent-with-local-tools-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Streaming
    project: agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: agent-framework-agent-with-local-tools-responses
    description: An Agent Framework agent with local tools hosted by Foundry.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # The researcher searches with a stronger model; other roles use the default.
      LEARNING_COACH_MODEL_RESEARCHER: gpt-6-luna
      # The hosted container's app directory is read-only; keep session data
      # (learning notes, visual artifacts, artifact index) on the writable tmpfs.
      LEARNING_COACH_DATA_DIR: /tmp/.learning-coach
      # Foundry Memory semantic layer (unset = disabled, pure SQLite).
      LEARNING_COACH_MEMORY_STORE: edu-agent-learning-memory
      LEARNING_COACH_MEMORY_SEARCH_MAX: '6'
      LEARNING_COACH_MEMORY_TIMEOUT: '5'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
