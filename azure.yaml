# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: agent-framework-agent-with-local-tools-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
      - name: text-embedding-3-small
        model:
          format: OpenAI
          name: text-embedding-3-small
          version: '1'
        sku:
          name: GlobalStandard
          capacity: 5
  agent-framework-agent-with-local-tools-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Streaming
    project: agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: agent-framework-agent-with-local-tools-responses
    description: An Agent Framework agent with local tools hosted by Foundry.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # The shared demo runs the single-agent architecture: same rules, tools
      # and checks, one agent does everything — several times faster and the
      # eval winner so far. Remove this line to switch back to the multi-agent
      # coach (its repair work continues in evals/).
      LEARNING_COACH_ARCHITECTURE: single
      # BoCha web search (mainland reachable, Chinese-first); unset = Wikipedia.
      BOCHA_API_KEY: ${BOCHA_API_KEY}
      # Scene design and reviews (including source checks) use a stronger
      # model; the coordinator, quiz writer and notes use the default.
      LEARNING_COACH_MODEL_VISUALIZER: gpt-6-luna
      LEARNING_COACH_MODEL_VERIFIER: gpt-6-luna
      # Foundry evaluations send each case as a new conversation; skip the
      # first-meeting questions so the reply answers the case itself.
      LEARNING_COACH_ONBOARDING: '0'
      # Context isolation: a reopened conversation link (other platform user,
      # or older than this many seconds) starts fresh, dropping history and state.
      LEARNING_COACH_CONTEXT_TTL_SECONDS: '900'
      # The hosted container's app directory is read-only; keep session data
      # (learning notes, visual artifacts, artifact index) on the writable tmpfs.
      LEARNING_COACH_DATA_DIR: /tmp/.learning-coach
      # Foundry Memory semantic layer (unset = disabled, pure SQLite).
      LEARNING_COACH_MEMORY_STORE: edu-agent-learning-memory
      LEARNING_COACH_MEMORY_SEARCH_MAX: '6'
      LEARNING_COACH_MEMORY_TIMEOUT: '5'
      # Public blob container for interactive visuals; provisioned by
      # scripts/setup-artifact-blob.sh (anonymous blob reads, unguessable
      # 32-char tokens, blobs auto-deleted by a 2-day lifecycle rule).
      LEARNING_COACH_ARTIFACT_BLOB_URL: https://eduartifacts5044621b.blob.core.windows.net/artifacts
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
  # Single-agent baseline for the single vs multi-agent comparison only
  # (evals/foundry_compare.py). Same code, LEARNING_COACH_ARCHITECTURE=single.
  edu-agent-single:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Responses Protocol
    project: agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: edu-agent-single
    description: Single-agent baseline of the learning coach, for comparison.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      LEARNING_COACH_ARCHITECTURE: single
      LEARNING_COACH_ONBOARDING: '0'
      LEARNING_COACH_DATA_DIR: /tmp/.learning-coach
      BOCHA_API_KEY: ${BOCHA_API_KEY}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
